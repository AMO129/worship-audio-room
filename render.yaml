services:
  - type: web
    name: worship-audio-room
    env: python
    autoDeployTrigger: commit
    region: oregon          # or frankfurt / singapore — pick closest to your users
    plan: free              # upgrade to starter for always-on (no spin-down)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TURN_URLS
        value: ""
      - key: TURN_SHARED_SECRET
        sync: false
