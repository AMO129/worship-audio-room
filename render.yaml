services:
  - type: web
    name: worship-audio-room
    env: python
    region: oregon          # or frankfurt / singapore — pick closest to your users
    plan: free              # upgrade to starter for always-on (no spin-down)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
